[project]
name = "wise-gnc-design"
version = "0.1.0"
description = "Wiseware's GNC flight software in two builds, Python and F´, flown against WiseDynamics' simulated spacecraft"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "bsk[all]",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "numba>=0.68",
    "numpy>=2.0",
    "pandas>=3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "check-python",
    "check-reqs",
    "hatchling",
    "pytest-xdist>=3.6",
]
sim = ["wise-dynamics[notebook]"]
notebooks = ["ipykernel>=6.29", "ipython>=9.0", "jupyter-client", "jupyterlab>=4.4", "jupytext>=1.17", "nbclient", "notebook", "pip", "traitlets"]
# The F´ toolchain, whose versions fsw/fprime reads from the F´ tag's requirements.txt, pybind11 for
# the deployment's Python module and pybind11-stubgen for its type stubs.
fprime = ["fprime-toolchain", "pybind11>=2.13", "pybind11-stubgen==3.0.0"]

[tool.uv]
# bsk caps Pillow at 12.2.0, below its security fixes. Basilisk never imports Pillow; matplotlib
# and bokeh, which do, accept 13. Drop the override once a Basilisk release lifts the cap.
override-dependencies = ["pillow>=13"]

[tool.uv.workspace]
members = ["fsw/fprime"]

[tool.uv.sources]
# The wise-ci commit CI's `check-python` and `check-python-floor` use.
check-python = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-python", rev = "63ae1c90f30257964989acce75abde1e886823a9" }
# The wise-ci commit docs/requirements pins, so ty resolves its validator's import.
check-reqs = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-reqs", rev = "63ae1c90f30257964989acce75abde1e886823a9" }
fprime-toolchain = { workspace = true }
# The WiseDynamics commit this repository's scenario tests verify against.
wise-dynamics = { git = "https://github.com/WisewareOrg/WiseDynamics", rev = "1b4243927e6902e728356e63c6b084b45e922323" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algorithms", "fsw", "ground", "lab"]
# The repository root makes `harness` importable as a package.
dev-mode-dirs = [".", "analysis"]

[tool.pytest.ini_options]
testpaths = ["algorithms", "fsw", "ground", "harness", "lab", "missions"]
strict_markers = true
markers = [
    "sim_ground_period_s(period_s): the ground's period, in s, for a scenario's definition",
]
# A coroutine never awaited, such as a ground procedure's forgotten `await`, fails its test.
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Exception ignored .*coroutine:pytest.PytestUnraisableExceptionWarning",
]
# The F´ framework clone and the F´ build cache carry F´'s own tests, which are not this project's.
addopts = [
    "--import-mode=importlib", "-n", "logical", "-p", "pytester",
    "--ignore=fsw/fprime/lib", "--ignore-glob=fsw/fprime/build-fprime-*",
]

[tool.ruff]
line-length = 120
src = [".", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"
