[project]
name = "wise-gnc-design"
version = "0.1.0"
description = "Wiseware GNC flight software: the IMU dead reckoner, its Basilisk host, and its accuracy bound"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "scipy>=1.16",
]

[project.optional-dependencies]
basilisk = ["bsk[all]"]
analysis = ["h5py>=3.11", "matplotlib>=3.9"]

[dependency-groups]
dev = [
    "wise-gnc-design[analysis,basilisk]",
    "interrogate>=1.7.0",
    "ipykernel>=6.29",
    "jupytext>=1.17",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
    "pydoclint>=0.12.0",
]
sim = ["wise-dynamics[notebook]"]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.4", "jupytext>=1.17", "notebook", "pip"]

[tool.uv.sources]
# The WiseDynamics commit this repository's scenario tests verify against.
wise-dynamics = { git = "https://github.com/WisewareOrg/WiseDynamics", rev = "6c83ec74d8ee9dcc860c02f78d60ca46082da7cf" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algorithms/gnc_algorithms", "cdh/gnc_cdh", "analysis/gnc_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests", "algorithms"]
python_files = ["test_*.py", "*/gnc_algorithms/*.py"]
markers = ["verifies(*ids): the requirement IDs a Monte Carlo test verifies"]
addopts = ["--import-mode=importlib", "-n", "auto", "-p", "pytester"]

[tool.ruff]
line-length = 100
src = ["algorithms", "cdh", "analysis"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true
