[project]
name = "wise-gnc-design"
version = "0.1.0"
description = "Wiseware GNC flight software: the IMU dead reckoner, its Basilisk host, and its accuracy bound"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "scipy>=1.16",
]

[project.optional-dependencies]
basilisk = ["bsk[all]"]
analysis = ["h5py>=3.11", "matplotlib>=3.9", "pandas>=3.0", "pyyaml>=6.0"]

[dependency-groups]
dev = [
    "wise-gnc-design[analysis,basilisk]",
    "interrogate>=1.7.0",
    "ipykernel>=6.29",
    "jupytext>=1.17",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
    "pydoclint>=0.12.0",
]
sim = ["wise-dynamics[notebook]"]
notebooks = ["ipykernel>=6.29", "ipython>=9.0", "jupyterlab>=4.4", "jupytext>=1.17", "notebook", "pip"]
# The F´ toolchain at the versions the F´ clone pins (held to them by fsw/fprime/pins_test.py),
# packaging, which that test parses with, and pybind11 for the deployment's Python module.
fprime = ["cmake==3.26.0", "fprime-fpp==3.4.0", "fprime-gds==4.4.0", "fprime-tools==4.4.0", "ninja==1.11.1.4", "packaging", "pybind11>=2.13"]

[tool.uv.sources]
# The WiseDynamics commit this repository's scenario tests verify against.
wise-dynamics = { git = "https://github.com/WisewareOrg/WiseDynamics", rev = "973bb2d48099b1ed407fac6c7f3574e5dd4ae57c" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algorithms", "fsw", "ground", "lab"]
# The repository root makes `harness` importable as a package.
dev-mode-dirs = [".", "analysis"]

[tool.pytest.ini_options]
testpaths = ["algorithms", "fsw", "ground", "harness", "lab", "missions"]
strict_markers = true
markers = [
    "sim_ground_period_s(period_s): the ground's period, in s, for a scenario's definition",
]
# A coroutine never awaited, such as a ground procedure's forgotten `await`, fails its test.
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Exception ignored while finalizing coroutine:pytest.PytestUnraisableExceptionWarning",
]
# The F´ framework clone and the F´ build cache carry F´'s own tests, which are not this project's.
addopts = [
    "--import-mode=importlib", "-n", "auto", "--dist", "loadgroup", "-p", "pytester",
    "--ignore=fsw/fprime/lib", "--ignore-glob=fsw/fprime/build-fprime-*",
]

[tool.ruff]
line-length = 100
src = [".", "analysis"]
# The F´ framework clone and the F´ build cache carry third-party Python.
extend-exclude = ["*.ipynb", "fsw/fprime/lib", "fsw/fprime/build-fprime-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true
# The F´ framework clone and the F´ build cache carry third-party Python.
exclude = 'fsw/fprime/(lib|build-fprime-[^/]*)/'

[tool.interrogate]
exclude = ["fsw/fprime/lib", "fsw/fprime/build-fprime-automatic-native"]
