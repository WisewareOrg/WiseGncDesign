[project]
name = "wise-gnc-design"
version = "0.1.0"
description = "Wiseware GNC flight software: the IMU dead reckoner, its Basilisk host, and its accuracy bound"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
basilisk = ["bsk[all]"]
analysis = ["h5py>=3.11", "matplotlib>=3.9"]

[dependency-groups]
dev = [
    "wise-gnc-design[analysis,basilisk]",
    "ipykernel>=6.29",
    "jupytext>=1.17",
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
    "ruff>=0.17.0",
]
sim = ["wise-dynamics"]

[tool.uv.sources]
# The WiseDynamics commit this repository's scenario tests verify against.
wise-dynamics = { git = "https://github.com/WisewareOrg/WiseDynamics", rev = "801f8b97e29d5a708a1f2ed7112e47f88894ecae" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algorithms/gnc_algorithms", "cdh/gnc_cdh", "analysis/gnc_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["algorithms", "cdh", "analysis"]
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
