name: checks

# The commands in README.md's Development section: the repository's test-suite checks on pull
# requests.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run interrogate -v --fail-under 100 algorithms cdh analysis harness scenarios missions
      - run: uv run pydoclint algorithms cdh analysis harness scenarios missions

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # wise-ci check-reqs: every item and link reviewed, and no file a TST references changed since.
      - run: just reqs

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Syncs every group, registers the kernel and builds the F´ deployment the tests fly.
      - run: just _sync
      # The F´ tests skip when the extension is absent, so a build that lands none fails here.
      - run: uv run --no-sync python -c "import gnc_cdh.fprime._wise_fsw"
      - run: uv run --no-sync pytest
      # Everything the build and the suite write must be ignored; the log names what is not.
      - run: |
          out="$(git status --porcelain)"
          echo "$out"
          test -z "$out"

  python-first:
    name: python-first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # The Python path with no F´ build: the groups, the kernel and the F´ clone at the pinned tag,
      # which a Python build's dictionary is generated against; the F´ build's tests skip.
      - run: uv sync --locked --group sim --group notebooks --group fprime
      - run: uv run --no-sync python -m ipykernel install --sys-prefix --name wise-gnc-design --display-name "WiseGncDesign"
      - run: git clone --quiet --depth 1 --branch "$(just --evaluate fprime_tag)" https://github.com/nasa/fprime cdh/fprime/lib/fprime
      - run: uv run --no-sync pytest
      - run: |
          out="$(git status --porcelain)"
          echo "$out"
          test -z "$out"
