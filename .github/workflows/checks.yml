name: checks

# The repository's test-suite checks on pull requests: the requirements tree, the suite, and wise-ci's
# `check-python` (lint, docstring coverage and types, run after the F´ build so ty reads its generated
# stubs) and `check-adrs`. `just python` runs `check-python` locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # wise-ci check-reqs: every item and link reviewed, and no file a TST references changed since.
      - run: just reqs

  check-python:
    name: check-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # ty reads the F´ build's generated stubs and extensions, so the build comes first.
      - run: just _sync
      - uses: WisewareOrg/wise-ci/check-python@d2483ccf39ccce58ccfbaa75d3d1c6466ff6701e

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      # Tests on requires-python's floor, not whatever Python the runner image ships.
      - run: echo "UV_PYTHON=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["requires-python"].removeprefix(">="))')" >> "$GITHUB_ENV"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Syncs every group, registers the kernel and builds the F´ deployment the tests fly.
      - run: just _sync
      # The F´ tests skip when an extension or its dictionary is absent, so this step imports every
      # configuration's extension the F´ build builds, of the repository's contract and the test
      # mocks', and checks its dictionary exists, and imports `_<name>` of every algorithm utility
      # with a CMakeLists.txt; a build that leaves any out fails here.
      - run: |
          uv run --no-sync python - <<'PY'
          import importlib
          from pathlib import Path

          import lab
          from fsw.codegen.deployment import CONTRACT, fprime_configurations
          from fsw.mock import MOCK

          for contract in (CONTRACT, MOCK):
              for c in fprime_configurations(contract=contract):
                  importlib.import_module(f"lab._wise_fsw_{c}")
                  assert lab.dictionary_path(c).exists(), c
          for cmake in Path("algorithms/utils").glob("*/CMakeLists.txt"):
              name = cmake.parent.name
              importlib.import_module(f"algorithms.utils.{name}._{name}")
          PY
      - run: uv run --no-sync pytest
      # Everything the build and the suite write must be ignored; the log names what is not.
      - run: |
          out="$(git status --porcelain)"
          echo "$out"
          test -z "$out"

  python-first:
    name: python-first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      # Tests on requires-python's floor, not whatever Python the runner image ships.
      - run: echo "UV_PYTHON=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["requires-python"].removeprefix(">="))')" >> "$GITHUB_ENV"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # The Python path with no F´ build: the groups, the kernel and the F´ clone at the pinned tag,
      # which a Python build's dictionary is generated against; the F´ build's tests skip.
      - run: uv sync --locked --group sim --group notebooks --group fprime
      - run: uv run --no-sync python -m ipykernel install --sys-prefix --name wise-gnc-design --display-name "WiseGncDesign"
      - run: git clone --quiet --depth 1 --branch "$(just --evaluate fprime_tag)" https://github.com/nasa/fprime fsw/fprime/lib/fprime
      - run: uv run --no-sync pytest
      - run: |
          out="$(git status --porcelain)"
          echo "$out"
          test -z "$out"

  check-adrs:
    name: check-adrs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docs/decisions/ agrees with its index, and every ADR citation pins the ADR's current rev.
      - uses: WisewareOrg/wise-ci/check-adrs@6f8840aacdd7eb0c431af64f7eaa7bf326b38e29
