name: checks

# The commands in README.md's Development section: the repository's test-suite checks on pull
# requests.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      REQUIRE_SIM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked --group sim
      # Every tier, with a two-case campaign written to one directory by two workers.
      - name: pytest -n 2 --sim-runs 2
        shell: bash
        run: |
          status=0
          uv run pytest -n 2 --sim-runs 2 --sim-out "$RUNNER_TEMP/campaign" > "$RUNNER_TEMP/pytest.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/pytest.log"
          [ "$status" -eq 0 ] || exit "$status"
          [ "$(grep -c '^campaign check: 2 runs loaded from ' "$RUNNER_TEMP/pytest.log")" -eq 1 ]
      - run: uv run gnc-analyze "$RUNNER_TEMP/campaign" --out "$RUNNER_TEMP/report"

  literate:
    name: literate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked --group sim
      # Literate documents: every algorithm module under algorithms/gnc_algorithms/ and every
      # campaign document notebooks/*.py. jupytext --sync rewrites the stale half of each pair, so
      # a clean tree afterwards means every pair was in sync.
      - name: Sync every literate document; committed notebooks carry no outputs
        shell: bash
        run: |
          shopt -s nullglob
          modules=()
          for path in algorithms/gnc_algorithms/*.py; do
            [ "$(basename "$path")" = __init__.py ] || modules+=("$path")
          done
          [ ${#modules[@]} -gt 0 ] || { echo "no literate module under algorithms/gnc_algorithms/"; exit 1; }
          for path in "${modules[@]}" notebooks/*.py; do uv run jupytext --sync "$path"; done
          test -z "$(git status --porcelain)"
          uv run python -c 'import json, pathlib, sys; bad = sorted(str(p) for p in pathlib.Path("notebooks").glob("*.ipynb") if any(c.get("outputs") or c.get("execution_count") is not None for c in json.loads(p.read_text())["cells"])); sys.exit(f"notebooks committed with outputs: {bad}" if bad else 0)'
      - name: Run every algorithm module as a script
        shell: bash
        run: |
          for path in algorithms/gnc_algorithms/*.py; do
            module=$(basename "$path" .py)
            [ "$module" = __init__ ] || uv run python -m "gnc_algorithms.$module"
          done
      - name: Run every campaign document with GNC_CAMPAIGN_RUNS=2
        shell: bash
        env:
          GNC_CAMPAIGN_RUNS: "2"
        run: |
          shopt -s nullglob
          for path in notebooks/*.py; do
            status=0
            uv run python "$path" > "$RUNNER_TEMP/campaign.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/campaign.log"
            [ "$status" -eq 0 ] || exit "$status"
            [ "$(grep -c '^campaign: 2 runs, ' "$RUNNER_TEMP/campaign.log")" -eq 1 ]
          done
