name: checks

# Repo-wide invariant: algorithms/ carries no simulation or flight-framework name, so flight
# code stays host-swappable (scripts/check-no-framework.sh). Not a required-status-check
# context (repository-floor.yml names only check-branch, pr-title and repo-floor); this is the
# repo's own invariant gate.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-no-framework:
    name: check-no-framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No simulation or flight-framework name appears under algorithms/
        run: scripts/check-no-framework.sh

  check-cdh-independent:
    name: check-cdh-independent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No WiseDynamics module is imported under cdh/
        run: scripts/check-cdh-independent.sh

  check-cdh-dictionary-neutral:
    name: check-cdh-dictionary-neutral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cdh/bindings.py names no transport-specific type or field
        run: scripts/check-cdh-dictionary-neutral.sh

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - run: uv sync --locked --extra basilisk
      - run: uv run pytest

  jupytext:
    name: jupytext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - run: uv sync --locked

      # jupytext --sync has no standalone "is it in sync" flag: --check pipes the notebook into
      # another program and asserts a non-zero exit, which isn't this. --sync rewrites whichever
      # side is stale, so running it and then requiring a clean working tree is the actual check.
      - name: notebooks/imu_dead_reckoning.ipynb matches algorithms/gnc_algorithms/imu_dead_reckoning.py
        run: |
          uv run jupytext --sync algorithms/gnc_algorithms/imu_dead_reckoning.py
          git diff --exit-code

      # Runs the literate module top to bottom, so its assertion cells execute; a failed
      # assertion raises and fails this step. Plain `python -m`, not `jupytext --execute`: no
      # Jupyter kernel dependency, and this is the same code path `import` already takes.
      - name: Assertion cells in imu_dead_reckoning.py pass
        run: uv run python -m gnc_algorithms.imu_dead_reckoning
