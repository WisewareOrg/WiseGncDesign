name: checks

# The commands in README.md's Development section: the repository's test-suite checks on pull
# requests.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run interrogate -v --fail-under 100 algorithms cdh analysis notebooks tests
      - run: uv run pydoclint algorithms cdh analysis notebooks tests

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      REQUIRE_SIM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --group sim
      - run: uv run pytest -n 2 --sim-runs 2
      - name: The Monte Carlo notebook with GNC_MONTE_CARLO_RUNS=2
        env:
          GNC_MONTE_CARLO_RUNS: "2"
        run: uv run python notebooks/imu_dead_reckoning_monte_carlo.py
