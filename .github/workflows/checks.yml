name: checks

# The commands in README.md's Development section: the repository's test-suite checks on pull
# requests.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run interrogate -v --fail-under 100 algorithms cdh analysis tests
      - run: uv run pydoclint algorithms cdh analysis tests

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked --group sim --group notebooks
      - run: uv run pytest --ci
      - name: The IMU dead reckoner's notebook
        run: |
          uv run --no-sync python -m ipykernel install --user --name uv-project --display-name "Python (uv)"
          JPY_SESSION_NAME=$PWD/algorithms/gnc_algorithms/imu_dead_reckoning.py uv run --no-sync jupytext --execute algorithms/gnc_algorithms/imu_dead_reckoning.py -o "$RUNNER_TEMP/imu_dead_reckoning.ipynb"
