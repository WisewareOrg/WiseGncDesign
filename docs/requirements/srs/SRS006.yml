rationale: |
  The wheel's spin-axis momentum gains exactly the torque the flight software commands, so a
  command lost, late or misread between the GNC and the wheel moves it off the commanded torque's
  integral. 1e-4 N*m*s is about 1e-3 rad/s of wheel speed on the HR16's spin inertia.
