text: |
  A mission's FSW boots in the leo400 scenario on the mission's vehicle and runs for 5700 s, once
  per dispersed case. 60 s after boot the ground gives nav its state from tracking with
  `nav.initNavState`, and waits for nav to report it is no longer idle.
verification-justification: |
  Settles each linked rung, for each mission flying it, over this scenario's dispersions and
  duration. Leaves unproven any other scenario, and any rung needing more cases than it flies.
